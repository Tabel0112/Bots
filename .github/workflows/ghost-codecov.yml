name: Ghost API tests and coverage

on:
  push:
    paths:
      - ghostapi/**
      - .github/workflows/ghost-codecov.yml
      - codecov.yml
  pull_request:
    paths:
      - ghostapi/**
      - .github/workflows/ghost-codecov.yml
      - codecov.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ghostapi/requirements-dev.txt

      - name: Install Python coverage tool
        run: python -m pip install -r ghostapi/requirements-dev.txt

      - name: Run Python tests with coverage
        run: |
          python -m coverage run --branch --source=ghostapi/demo --omit='ghostapi/demo/test_*.py' --data-file=ghostapi/.coverage -m unittest discover -s ghostapi/demo -p 'test_*.py' -v
          python -m coverage xml --data-file=ghostapi/.coverage --fail-under=70 -o ghostapi/coverage-python.xml

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run flowchart tests with coverage
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include='ghostapi/demo/flowchart.js'
          --test-coverage-exclude='**/test_*.js'
          --test-reporter=spec
          --test-reporter-destination=stdout
          --test-reporter=lcov
          --test-reporter-destination=ghostapi/coverage-flowchart.lcov
          ghostapi/demo/test_flowchart.js

      - name: Upload Python coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ghostapi/coverage-python.xml
          flags: ghost-python
          disable_search: true
          fail_ci_if_error: true

      - name: Upload flowchart coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ghostapi/coverage-flowchart.lcov
          flags: ghost-flowchart
          disable_search: true
          fail_ci_if_error: true
