name: DOM browser worker

on:
  push:
    paths:
      - Agents/browser_worker/**
      - tests/browser_worker/**
      - pyproject.toml
      - ghostapi/**
      - Agents/visual/browser_subagent/**
      - .github/workflows/browser-worker.yml
  pull_request:
    paths:
      - Agents/browser_worker/**
      - tests/browser_worker/**
      - pyproject.toml
      - ghostapi/**
      - Agents/visual/browser_subagent/**
      - .github/workflows/browser-worker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test,visual]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -c tests/browser_worker/pytest.ini tests/browser_worker -q
      - run: python -m ruff check --config Agents/browser_worker/ruff.toml Agents/browser_worker tests/browser_worker
      - run: python -m ruff format --check --config Agents/browser_worker/ruff.toml Agents/browser_worker tests/browser_worker
