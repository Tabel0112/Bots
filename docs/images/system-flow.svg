<rect x="130" y="1130" width="400" height="64" rx="8" fill="#163d2e" stroke="#163d2e" stroke-width="2"/>
<text x="330" y="1157" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Answer</text>
